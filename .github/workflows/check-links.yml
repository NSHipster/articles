name: Check links

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --no-progress
            --base-url https://nshipster.com/
            --scheme http
            --scheme https
            --exclude-loopback
            --exclude '^https?://(www\.)?example\.(com|org|net)'
            --max-retries 2
            --timeout 30
            --accept 200..=299,403,429
            --exclude-path LICENSE.md
            './*.md'
          output: lychee/report.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the open broken links issue
        id: issue
        if: steps.lychee.outputs.exit_code != 0
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label links --state open \
            --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open or update the broken links issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links
          content-filepath: lychee/report.md
          issue-number: ${{ steps.issue.outputs.number }}
          labels: links
